name: Build Neomorph X1 Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Nötige Linux-Systembibliotheken für JUCE installieren
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            ladspa-sdk freeglut3-dev g++ libx11-dev libxcomposite-dev \
            libxcursor-dev libxinerama-dev librandr-dev libxrender-dev \
            libsysfs-dev libgl1-mesa-dev libglu1-mesa-dev libfreetype6-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.0-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: cmake --build build --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeomorphX1-${{ matrix.os }}
          path: |
            build/NeomorphX1_artefacts/Release/VST3/
            build/NeomorphX1_artefacts/Release/AU/
            build/NeomorphX1_artefacts/Release/Standalone/
            build/NeomorphX1_artefacts/Release/